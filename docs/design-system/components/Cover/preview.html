<style>
  body {
    margin: 0;
    background: var(--bg);
  }
  .cover {
    position: relative;
    width: 960px;
    height: 288px;
    overflow: hidden;
    background: var(--bg);
  }
  .art {
    position: absolute;
    inset: 0;
  }
  .deep {
    fill: var(--ink-800);
  }
  .signal {
    fill: var(--teal-500);
  }
  .fill {
    fill: var(--teal-700);
  }
  .mint {
    fill: var(--teal-300);
  }
  .wind {
    fill: var(--lime-300);
  }
  .streak {
    fill: var(--ink-50);
  }
  .card-corner {
    rx: var(--radius-2xl);
  }
  .pill {
    rx: 4px;
  }
  .pill-wide {
    rx: 6px;
  }
  .text {
    position: absolute;
    left: 32px;
    bottom: 32px;
    width: 440px;
  }
  .name {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 112px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  .tagline {
    margin: 8px 0 0;
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    color: var(--fg-muted);
  }
</style>
<div class="cover">
  <svg
    class="art"
    viewBox="0 0 960 288"
    width="960"
    height="288"
    aria-hidden="true"
  >
    <!--
      blocks: ink-800 × 288 by 256 (the atmosphere), teal-500 × 192 by 160 (the one primary), teal-700 × 192 by 80, teal-300 × 96 by 80, lime-300 × 96 by 16 (wind data, kept small).
      arrangement: a staggered stack bleeding off the top and right edges, with a tall ink slab holding the streaks.
      pattern: wind streaks, because the brand says wind is geometry and its own bar runs teal to lime as knots rise; tight corners keep it aerodynamic rather than pill-like.
      steps and radii: blocks on space-4 multiples, streaks 8px and 12px tall on a space-6 pitch, corners radius-2xl, streak ends radius-xs and radius-sm.
    -->
    <rect class="deep card-corner" x="512" y="-18" width="256" height="288" />
    <rect class="signal card-corner" x="768" y="-18" width="210" height="178" />
    <rect class="fill card-corner" x="768" y="176" width="210" height="80" />
    <rect class="mint card-corner" x="672" y="208" width="80" height="80" />

    <rect
      class="streak pill"
      x="544"
      y="32"
      width="192"
      height="8"
      opacity="0.32"
    />
    <rect
      class="streak pill"
      x="576"
      y="56"
      width="160"
      height="8"
      opacity="0.5"
    />
    <rect
      class="streak pill"
      x="528"
      y="80"
      width="208"
      height="8"
      opacity="0.7"
    />
    <rect class="mint pill-wide" x="592" y="104" width="144" height="12" />
    <rect class="mint pill-wide" x="560" y="128" width="176" height="12" />
    <rect class="wind pill-wide" x="608" y="152" width="128" height="12" />
  </svg>
  <div class="text">
    <h1 class="name">AERYO</h1>
    <p class="tagline">Intelligent wind, made tangible.</p>
  </div>
</div>
