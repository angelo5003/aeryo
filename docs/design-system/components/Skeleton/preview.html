<div id="preview-root" style="padding: 16px"></div>
<script>
  const { React, mountPreview, Skeleton, Stack, Flex } = window.Aeryo;
  const h = React.createElement;

  mountPreview(
    document.getElementById("preview-root"),
    h(
      Flex,
      { gap: "4", align: "center" },
      h(Skeleton, { variant: "avatar" }),
      h(Stack, { flex: "1" }, h(Skeleton, { variant: "text", lines: 3 })),
    ),
  );
</script>
