<div id="preview-root" style="padding: 16px"></div>
<script>
  const {
    React,
    mountPreview,
    AeryoCard,
    AeryoCardHeader,
    AeryoCardBody,
    AeryoCardFooter,
    Button,
    Text,
  } = window.Aeryo;
  const h = React.createElement;

  mountPreview(
    document.getElementById("preview-root"),
    h(
      AeryoCard,
      { maxW: "sm" },
      h(AeryoCardHeader, {
        overline: "Saturday",
        title: "North Sea session",
        subtitle: "Wijk aan Zee",
      }),
      h(
        AeryoCardBody,
        null,
        h(Text, null, "Clean north-westerly, best after three."),
      ),
      h(AeryoCardFooter, null, h(Button, { size: "sm" }, "Join")),
    ),
  );
</script>
