<div id="preview-root" style="padding: 16px"></div>
<script>
  const { React, mountPreview, Tag, Flex } = window.Aeryo;
  const h = React.createElement;

  mountPreview(
    document.getElementById("preview-root"),
    h(
      Flex,
      { gap: "2", wrap: "wrap" },
      h(Tag, null, "Freestyle"),
      h(Tag, { intent: "info" }, "Foil"),
      h(
        Tag,
        { intent: "success", closable: true, onClose: () => {} },
        "15+ kn",
      ),
    ),
  );
</script>
