name: Production Pipeline

on:
  push:
    branches:
      - main

# Zorgt ervoor dat oude builds stoppen als je snel achter elkaar pusht
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI version used locally, instead of `latest`.
          version: 2.98.1
      - name: Push Migrations
        # GitHub Actions runners are IPv4-only; direct db.<ref>.supabase.co:5432
        # is IPv6-only without the paid IPv4 add-on. Route through Session
        # Pooler (port 5432, IPv4 on every tier) instead.
        # per https://supabase.com/docs/guides/database/connecting-to-postgres
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_POOLER_URL }}"
      - name: Deploy Edge Functions
        # --no-verify-jwt: this function runs before a session exists (login
        # itself), so it can't require a caller JWT. Matches the deployed
        # function's current verify_jwt: false setting.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy login --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --no-verify-jwt

  web-deploy:
    name: Web Deployment (Vercel)
    runs-on: ubuntu-latest
    needs: database # Wacht met Vercel tot de database klaar is
    # Hier vertellen we de hele job wat de Vercel ID's zijn
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        # Pinned to the CLI version used locally, instead of `latest`.
        run: npm install --global vercel@59.19.0
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Next.js App
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  android-build:
    name: Android Native Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Sync Capacitor Android
        run: npm run android:sync
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleRelease
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeryo-android-apk
          # No signingConfig in android/app/build.gradle, so Gradle names the
          # release APK `-unsigned`.
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  ios-build:
    name: iOS Native Build
    # xcodebuild only exists on macOS runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Sync Capacitor iOS
        run: npm run ios:sync
      # iOS uses Swift Package Manager (Package.swift), not CocoaPods —
      # no Podfile/.xcworkspace in this repo. `xcodebuild` resolves SPM
      # packages itself; no separate install step is needed.
      - name: Build iOS App
        working-directory: ./ios/App
        # -derivedDataPath keeps build output inside the repo; without it
        # xcodebuild writes to ~/Library/Developer/Xcode/DerivedData and the
        # upload step below finds nothing.
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeryo-ios-app
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [web-deploy, android-build, ios-build]
    # default GITHUB_TOKEN is read-only unless a job states otherwise.
    # contents:write lets semantic-release push the version tag/notes;
    # issues/pull-requests:write let its "success" step comment on the
    # issues/PRs associated with released commits.
    # per https://semantic-release.org/usage/ci-configuration#authentication
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
